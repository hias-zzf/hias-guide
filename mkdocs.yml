site_name: 国科大杭高智能学院考研报考指南
site_description: 非官方公益报考指南，汇总杭高智能学院报考、复试、培养与导师信息
docs_dir: docs_src
site_dir: site
theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  icon:
    logo: material/school
  favicon: assets/images/favicon.svg
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: amber
    toggle:
      icon: material/weather-night
      name: 切换深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: amber
    toggle:
      icon: material/weather-sunny
      name: 切换浅色模式
plugins:
- search:
    lang:
    - zh
    - en
hooks:
- hooks/homepage_toc.py
extra_css:
- assets/stylesheets/custom.css
markdown_extensions:
- admonition
- attr_list
- md_in_html
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
