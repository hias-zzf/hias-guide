site_name: 国科大杭州高等研究院报考指南
site_description: 非官方公益报考指南，介绍杭州高等研究院（杭高院）及其二级学院，汇总报考、复试、培养与上岸经验
repo_url: https://github.com/hias-zzf/hias-guide
repo_name: hias-guide
edit_uri: edit/main/
docs_dir: docs_src
site_dir: site
theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  icon:
    logo: material/school
  favicon: assets/images/favicon.svg
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.top
  - navigation.footer
  - navigation.tabs
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.tabs.link
  - content.action.edit
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: amber
    toggle:
      icon: material/weather-night
      name: 切换深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: amber
    toggle:
      icon: material/weather-sunny
      name: 切换浅色模式
plugins:
- search:
    lang:
    - zh
    - en
hooks:
- revision_hook.py

extra_css:
- assets/stylesheets/custom.css
- assets/stylesheets/leaflet.css
extra_javascript:
- assets/javascripts/echarts.min.js
- assets/javascripts/wlgd-charts.js
- assets/javascripts/leaflet.js
- assets/javascripts/map.js
- assets/javascripts/intel-charts.js
- assets/javascripts/guide-pledge.js
markdown_extensions:
- admonition
- attr_list
- md_in_html
- def_list
- footnotes
- meta
- toc:
    permalink: true
    slugify: !!python/object/apply:pymdownx.slugs.slugify
      kwds:
        case: lower
- pymdownx.caret
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.magiclink
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
- pymdownx.tabbed:
    alternate_style: true
